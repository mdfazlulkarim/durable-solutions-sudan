name: Refresh area-based coordination data

# Downloads the latest public data (HDX, OCHA, IOM DTM, HeiGIT, OpenStreetMap, FEWS NET, Sudan Humanitarian Fund)
# and rebuilds data/abc/*.json for the Area-based coordination page (abc.html).
# Run it from the Actions tab: "Refresh area-based coordination data" > "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abc-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tools
        run: |
          pip install openpyxl
          npm install --no-save --no-package-lock d3-geo topojson-server topojson-simplify topojson-client polylabel
      - name: Download data
        run: python scripts/abc_fetch.py
      - name: Build the page data
        run: |
          node scripts/build_abc_points.js raw
          python scripts/build_abc_data.py raw
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/abc
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Area-based coordination: data refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
